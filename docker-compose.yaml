services:
  database:
    container_name: database_core
    image: postgres:17
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./docker/postgresql/data:/var/lib/postgresql/data
    networks:
      - public_network

networks:
  private_network:
    driver: bridge
  public_network:
    driver: bridge